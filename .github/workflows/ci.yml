name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Backend - .NET API
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore src/IAM.API/IAM.API.csproj

    - name: Build
      run: dotnet build src/IAM.API/IAM.API.csproj --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/IAM.UnitTests/IAM.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Run integration tests
      run: dotnet test tests/IAM.Integration.Tests/IAM.Integration.Tests.csproj --configuration Release --no-build --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=iam_test;Username=postgres;Password=postgres"

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Backend Test Results
        path: '**/test-results.trx'
        reporter: dotnet-trx

  # Frontend - React Admin
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/IAM.Admin.Web/package-lock.json

    - name: Install dependencies
      working-directory: src/IAM.Admin.Web
      run: npm ci

    - name: Run linter
      working-directory: src/IAM.Admin.Web
      run: npm run lint

    - name: Run tests
      working-directory: src/IAM.Admin.Web
      run: npm test -- --coverage

    - name: Build
      working-directory: src/IAM.Admin.Web
      run: npm run build

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: src/IAM.Admin.Web/coverage/coverage-final.json
        flags: frontend

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  # Code Quality
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones disabled for SonarCloud

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=martiendejong_iam-system
          -Dsonar.organization=martiendejong
          -Dsonar.sources=src
          -Dsonar.tests=tests

  # E2E Tests
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: iam_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Start backend
      run: |
        cd src/IAM.API
        dotnet run &
        sleep 10
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=iam_test;Username=postgres;Password=postgres"
        ASPNETCORE_ENVIRONMENT: Test

    - name: Install Playwright
      working-directory: tests/IAM.E2E.Tests
      run: npm ci && npx playwright install --with-deps

    - name: Run E2E tests
      working-directory: tests/IAM.E2E.Tests
      run: npx playwright test

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: tests/IAM.E2E.Tests/playwright-report/

  # Build Docker Image (on main branch only)
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: martiendejong/iam-system
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to Staging (develop branch)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.iam.dev

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: echo "Deploy to staging server"
      # Add your deployment script here

    - name: Run smoke tests
      run: echo "Run smoke tests on staging"
      # Add smoke test script here

  # Deploy to Production (main branch, manual approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, e2e-test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://iam.dev

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: echo "Deploy to production server"
      # Add your deployment script here

    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
